[build]
  base = "."
  publish = "dist"
  command = "npm run build:netlify"
  environment = { HUSKY = "0" }

[build.environment]
  NODE_ENV = "production"
  PLATFORM_MODE = "production"
  NODE_VERSION = "18"

[[redirects]]
  from = "/dashboards/*"
  to = "/Dashboards/UI/vueComponentsBuilt/:splat"
  status = 200

[[redirects]]
  from = "/social-trading/*"
  to = "/Social-Trading/Vue-UI/dist/:splat"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/platform"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  directory = "netlify/functions"
  node_bundler = "nft"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"